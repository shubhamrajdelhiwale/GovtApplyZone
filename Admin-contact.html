<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Contact Admin – GovtApplyZone</title>
  <meta name="description" content="Contact the admin of GovtApplyZone for feedback, support, or any queries related to government exams, mock tests, books or results.">
  
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://blog.govtapplyzone.site/Admin-contact.html">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 text-gray-800">

  <!-- HERO -->
  <section class="bg-blue-600 text-white py-14">
    <div class="max-w-7xl mx-auto px-4">
      <h1 class="text-4xl font-bold mb-2">Contact Admin</h1>
      <p class="text-lg max-w-3xl">Have questions, feedback or need help? Contact the admin of GovtApplyZone.</p>
    </div>
  </section>

  <!-- CONTACT FORM -->
  <section class="max-w-3xl mx-auto px-4 py-12 bg-white rounded-xl shadow">
    <form action="#" method="POST" class="space-y-6">
      
      <div>
        <label class="block text-sm font-semibold mb-1" for="name">Your Name</label>
        <input type="text" id="name" name="name" required
               class="w-full border border-gray-300 p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <div>
        <label class="block text-sm font-semibold mb-1" for="email">Your Email</label>
        <input type="email" id="email" name="email" required
               class="w-full border border-gray-300 p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <div>
        <label class="block text-sm font-semibold mb-1" for="subject">Subject</label>
        <input type="text" id="subject" name="subject" required
               class="w-full border border-gray-300 p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <div>
        <label class="block text-sm font-semibold mb-1" for="message">Message</label>
        <textarea id="message" name="message" rows="5" required
                  class="w-full border border-gray-300 p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
      </div>

      <div class="text-center">
        <button type="submit"
                class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700">
          Send Message
        </button>
      </div>

    </form>
  </section>

  <!-- INFO BLOCK -->
  <section class="max-w-7xl mx-auto px-4 py-10 text-center text-gray-700">
    <h2 class="text-xl font-semibold mb-2">Other Ways to Reach Us</h2>
    <p>
      Email: <a href="mailto:support@govtapplyzone.site" class="text-blue-600 hover:underline">support@govtapplyzone.site</a>
    </p>
    <p>Twitter: <a href="https://twitter.com/" class="text-blue-600 hover:underline">@GovtApplyZone</a></p>
    <p>Instagram: <a href="https://instagram.com/" class="text-blue-600 hover:underline">@GovtApplyZone</a></p>
  </section>

  <!-- FOOTER -->
  <footer class="bg-gray-900 text-gray-300 py-6 text-center text-sm">
    © 2026 GovtApplyZone.site – Contact Admin
  </footer>

</body>
</html>
