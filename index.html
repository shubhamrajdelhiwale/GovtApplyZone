    const container = document.getElementById("examContainer");
    const searchInput = document.getElementById("searchInput");
    const filterEligibility = document.getElementById("filterEligibility");
    const filterMonth = document.getElementById("filterMonth");

    function renderExams(list) {
      container.innerHTML = list.map(exam => `
        <div class="exam-card">
          <h3>${exam.name}</h3>
          <p>${exam.desc}</p>
          <div class="tags">
            <div class="tag">Fees: ${exam.fee}</div>
            <div class="tag">Eligibility: ${exam.eligibility}</div>
            <div class="tag">Vacancies: ${exam.vacancies}</div>
            <div class="tag">Date: ${exam.date}</div>
          </div>
          <div class="btns">
            <a href="${exam.detailsPage}" class="btn btn-details">View Details</a>
            <a href="${exam.officialLink}" target="_blank" rel="noopener noreferrer" class="btn btn-link">Official Link</a>
          </div>
        </div>
      `).join("");
    }

    function filterExams() {
      const search = searchInput.value.toLowerCase();
      const eligibility = filterEligibility.value;
      const month = filterMonth.value;
      const filtered = exams.filter(e =>
        e.name.toLowerCase().includes(search) &&
        (eligibility === "" || e.eligibility === eligibility) &&
        (month === "" || e.month.includes(month))
      );
      renderExams(filtered);
    }

    // Initial render
    renderExams(exams);

    // Filters
    searchInput.addEventListener("input", filterExams);
    filterEligibility.addEventListener("change", filterExams);
    filterMonth.addEventListener("change", filterExams);
  </script>
